<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Meus Gastos</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/icone.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body style="padding-bottom:0">
  <div class="login-wrap">
    <form class="card login-card" method="post" action="{{ url_for('views.login') }}">
      <input type="hidden" name="proximo" value="{{ proximo }}">
      <h1>Meus Gastos</h1>
      <p>Digite seu PIN para continuar</p>
      {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
      <label for="pin" class="sr">PIN</label>
      <input type="password" id="pin" name="pin" inputmode="numeric"
             autocomplete="current-password" pattern="[0-9]*" maxlength="8"
             required autofocus aria-label="PIN de acesso">
      <button class="btn" type="submit" style="margin-top:16px">Entrar</button>
    </form>
  </div>
</body>
</html>
